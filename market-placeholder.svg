<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">MarketDirectory market image placeholder</title>
  <desc id="desc">A simple illustrated market stall used when a market has no rights-cleared photo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <pattern id="dots" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="3" fill="#ea580c" opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#dots)"/>
  <circle cx="1010" cy="130" r="170" fill="#fb923c" opacity=".11"/>
  <circle cx="165" cy="675" r="220" fill="#7c3aed" opacity=".07"/>
  <g transform="translate(330 175)">
    <path d="M90 155h360l55 120H35z" fill="#fff" stroke="#431407" stroke-width="16" stroke-linejoin="round"/>
    <path d="M35 275h470" stroke="#431407" stroke-width="16" stroke-linecap="round"/>
    <path d="M75 275v255M465 275v255" stroke="#431407" stroke-width="16" stroke-linecap="round"/>
    <path d="M105 155l-35 120M175 155l-18 120M245 155v120M315 155l18 120M385 155l35 120M455 155l35 120" stroke="#ea580c" stroke-width="42" opacity=".92"/>
    <path d="M55 367h430v163H55z" fill="#fff" stroke="#431407" stroke-width="16" stroke-linejoin="round"/>
    <path d="M130 433h280" stroke="#c2410c" stroke-width="18" stroke-linecap="round" opacity=".72"/>
    <circle cx="177" cy="367" r="25" fill="#7c3aed" opacity=".78"/>
    <circle cx="245" cy="367" r="25" fill="#ea580c" opacity=".78"/>
    <circle cx="313" cy="367" r="25" fill="#16a34a" opacity=".72"/>
    <circle cx="381" cy="367" r="25" fill="#eab308" opacity=".75"/>
  </g>
  <text x="600" y="745" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#431407">MarketDirectory</text>
</svg>
