name: Market photos - batch02 bounded source visual preflight (review only)
on:
  push:
    branches:
      - review/bounded-photo-source-preflight-batch02-20261101
permissions:
  contents: read
  actions: read
concurrency:
  group: market-photo-20261101-source-batch02
  cancel-in-progress: false
jobs:
  pin-and-review-20-more-thumbnails:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout review-only source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download immutable original 100-market API search receipt
        uses: actions/download-artifact@v4
        with:
          name: public-commons-source-discovery
          repository: marketdirectory/marketdirectory-staging
          run-id: 41263223992
          github-token: ${{ github.token }}
          path: public-sweep-source
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install limited review decoder
        run: python -m pip install 'Pillow==11.3.0'
      - name: Check scripts and reconstruct exact SHA1/size/licence metadata from sweep
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/market-photo-visual-preflight/*.py
          python .github/market-photo-visual-preflight/build-batch02-review-input.py
      - name: Primary API double-check and thumbnail-only 16:9 crop review
        run: python .github/market-photo-visual-preflight/commons-thumb-preflight.py
      - name: Upload no-publication visual preflight package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 20261101-batch02-unselected-commons-review
          path: |
            public-photo-review-output/
            .github/market-photo-visual-preflight/INPUT_REVIEW_ONLY.json
          if-no-files-found: warn
          retention-days: 30
      - name: Record source-only batch completion
        if: always()
        shell: bash
        run: |
          echo '## Second 20-photo source preflight — REVIEW ONLY' >> "$GITHUB_STEP_SUMMARY"
          echo 'Original sweep receipt immutable SHA-256 verified before any API access. All prior holds; no original photos, no hero WebPs, no deployments, no CMS, no SQL, no release.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f public-photo-review-output/ACTUAL_PREFLIGHT_RECEIPT.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open("public-photo-review-output/ACTUAL_PREFLIGHT_RECEIPT.json"))
          print("Checked {}; preview success {}; held {}; approvals 0".format(r["checked"],r["preview_success"],r["preflight_held"]))
          PY
          fi
