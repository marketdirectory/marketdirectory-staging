name: Market photos - bounded public thumbnail visual preflight (read only)
on:
  push:
    branches:
      - review/bounded-photo-source-preflight-20261101
permissions:
  contents: read
concurrency:
  group: market-photo-20261101-thumbnail-review
  cancel-in-progress: false
jobs:
  check-primary-source-thumbnails:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated review code without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image decoder
        run: python -m pip install 'Pillow==11.3.0'
      - name: Validate source-only Python
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/market-photo-visual-preflight/commons-thumb-preflight.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.github/market-photo-visual-preflight/INPUT_REVIEW_ONLY.json')
          j=json.loads(p.read_text())
          assert j["all_unselected"] and j["retain_holds"]
          assert 1<=len(j["entries"])<=22
          assert all(x["prior_hold"] for x in j["entries"])
          print("REVIEW_ONLY_INPUT_PASS",len(j["entries"]))
          PY
      - name: Verify public Commons primary API and preview thumbnail crops only
        run: python .github/market-photo-visual-preflight/commons-thumb-preflight.py
      - name: Upload visual source-and-crop review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 20261101-unselected-public-photo-visual-review
          path: public-photo-review-output/
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve no-publication review disposition
        if: always()
        shell: bash
        run: |
          echo '## Thumbnail-only source and centre-crop preflight' >> "$GITHUB_STEP_SUMMARY"
          echo 'All candidates UNSELECTED and under original inherited holds. No originals, hero WebPs, CMS, SQL, deployments or publication.' >> "$GITHUB_STEP_SUMMARY"
          if [ -e public-photo-review-output/ACTUAL_PREFLIGHT_RECEIPT.json ]; then
            python -c 'import json; r=json.load(open("public-photo-review-output/ACTUAL_PREFLIGHT_RECEIPT.json")); print("Checked: {}; preview generated: {}; held: {}".format(r["checked"],r["preview_success"],r["preflight_held"]))' >> "$GITHUB_STEP_SUMMARY"
          fi
